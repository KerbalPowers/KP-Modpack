@PART[THERIM-162] // ESSM
{

  %MODULE[MissileLauncher]
  {
    activeRadarLockTrackCurve 
    {
      //   key = distance	rcs
           key = 0 0 0 0
           key = 2.5 0.2 0 0
    }

	%activeRadarCanNotch = true

	%DetonationDistance = 12
	%DetonateAtMinimumDistance = True
	%UseStaticMaxLaunchRange = True
	%adjustableProxyFuze  = false

	@activeRadarRangeGate
	{
        	key = 0		0
            	key = 10000	0
	}

	@activeRadarVelocityGate
	{
		key = 0 0.05 0.001 0.001
		key = 30 0.06 0.001589996 0.006
		key = 40 0.17 0.009711773 0.03535933
		key = 45 0.5 0.04114396 0.043
		key = 60 0.8 0.01019667 0.01166667
		key = 100 1 0.003333333 0.003333333
	}
  }
}
